services:
  db:
    image: postgres:latest
    container_name: pome_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      retries: 5
      timeout: 3s
    ports:
      - '5431:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: pome-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ANIME_URL: ${ANIME_URL}
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start:prod"]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
